# Elitea Platform — Prometheus Alert Rules (local dev)
# Standalone format compatible with prometheus rule_files directive.
# See elitea-platform/monitoring/alerts.yaml for the full PrometheusRule CR.

groups:
  - name: elitea.api
    rules:
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(http_requests_total{job="pylon_main",code=~"5.."}[5m]))
            /
            sum(rate(http_requests_total{job="pylon_main"}[5m]))
          ) > 0.01
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "API 5xx error rate above 1% for 5 minutes"

      - alert: HighLatency
        expr: |
          histogram_quantile(0.99,
            sum(rate(http_request_duration_seconds_bucket{job="pylon_main"}[5m])) by (le)
          ) > 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "API P99 latency above 5s for 5 minutes"

      - alert: HighLatencyWarning
        expr: |
          histogram_quantile(0.99,
            sum(rate(http_request_duration_seconds_bucket{job="pylon_main"}[5m])) by (le)
          ) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "API P99 latency above 2s (SLO breach)"

  - name: elitea.pods
    rules:
      - alert: PodCrashLooping
        expr: |
          increase(kube_pod_container_status_restarts_total{
            namespace="elitea-staging",
            container=~"pylon-main|pylon-indexer|pylon-auth"
          }[10m]) > 3
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Pod {{ $labels.pod }} crash-looping (>3 restarts in 10m)"

      - alert: PodNotReady
        expr: |
          kube_pod_status_ready{
            namespace="elitea-staging",
            condition="true",
            pod=~"pylon-.*"
          } == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.pod }} not ready for 5 minutes"

      - alert: HighMemoryUsage
        expr: |
          (
            container_memory_working_set_bytes{
              namespace="elitea-staging",
              container=~"pylon-main|pylon-indexer|pylon-auth"
            }
            /
            kube_pod_container_resource_limits{
              namespace="elitea-staging",
              resource="memory",
              container=~"pylon-main|pylon-indexer|pylon-auth"
            }
          ) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.container }} memory at {{ $value | humanizePercentage }} of limit"

  - name: elitea.redis
    rules:
      - alert: RedisDown
        expr: redis_up{job="redis"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Redis instance is down"

      - alert: RedisSentinelDown
        expr: |
          count(redis_sentinel_master_status{master_name="mymaster"} == 1) < 2
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Redis Sentinel quorum degraded"

      - alert: RedisHighMemory
        expr: |
          redis_memory_used_bytes{job="redis"}
          /
          redis_memory_max_bytes{job="redis"} > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage above 85%"

      - alert: RedisHighLatency
        expr: |
          redis_commands_duration_seconds_total{job="redis"}
          /
          redis_commands_processed_total{job="redis"} > 0.01
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis average command latency above 10ms"

  - name: elitea.database
    rules:
      - alert: PgBouncerPoolExhausted
        expr: |
          pgbouncer_pools_server_active_connections{database="centry"}
          >=
          pgbouncer_pools_server_max_connections{database="centry"}
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "PgBouncer pool exhausted"

      - alert: PgBouncerHighWaitTime
        expr: |
          pgbouncer_pools_client_wait_seconds{database="centry"} > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "PgBouncer client wait time above 5s"

      - alert: PostgresConnectionsHigh
        expr: |
          sum(pg_stat_activity_count{datname="centry"}) > 160
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connections above 160 (max: 200)"

  - name: elitea.socketio
    rules:
      - alert: SocketIOConnectionDrops
        expr: |
          rate(socketio_disconnections_total{job="pylon_main",reason="transport_error"}[5m]) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Socket.IO transport errors above 1/s"

  - name: elitea.events
    rules:
      - alert: StreamConsumerLag
        expr: |
          redis_stream_pending_messages{job="redis"} > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis Stream {{ $labels.stream }} has >1000 pending messages"

      - alert: DeadLetterQueueGrowing
        expr: |
          redis_stream_length{stream=~"dlq:.*"} > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "DLQ {{ $labels.stream }} has >100 messages"

  - name: elitea.tasks
    rules:
      - alert: TaskQueueBacklog
        expr: pylon_task_queue_depth > 200
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Task queue depth above 200 for 10 minutes"

      - alert: TaskClaimLatencyHigh
        expr: |
          histogram_quantile(0.95,
            sum(rate(task_claim_duration_seconds_bucket{job="pylon_main"}[5m])) by (le)
          ) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Task claim P95 latency above 3s"
