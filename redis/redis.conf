# Redis persistence configuration for Elitea platform
# Combines AOF (durability) + RDB (fast restarts, backups)

# --- Network ---
bind 0.0.0.0
port 6379
protected-mode no

# --- RDB Snapshots ---
# Save DB to disk if at least N keys changed within M seconds
save 900 1
save 300 10
save 60 10000

# Stop accepting writes on RDB save error (fail-safe)
stop-writes-on-bgsave-error yes

# Compress RDB files with LZF
rdbcompression yes

# CRC64 checksum at the end of RDB files
rdbchecksum yes

# RDB filename and directory
dbfilename dump.rdb
dir /data

# --- AOF (Append Only File) ---
appendonly yes

# fsync policy: everysec is a good compromise between durability and performance
# - always: fsync every write (safest, slowest)
# - everysec: fsync once per second (recommended)
# - no: let the OS flush when it wants (fastest, least durable)
appendfsync everysec

# Don't fsync during RDB save (avoids latency spike)
no-appendfsync-on-rewrite no

# Auto-rewrite AOF when it grows by 100% since last rewrite
auto-aof-rewrite-percentage 100

# Minimum AOF size before auto-rewrite triggers
auto-aof-rewrite-min-size 64mb

# Load truncated AOF on startup (recovers as much data as possible)
aof-load-truncated yes

# Use RDB preamble in AOF for faster loading
aof-use-rdb-preamble yes

# --- Memory ---
# maxmemory not set — use container memory limits instead
# maxmemory-policy noeviction (default: reject writes when full)

# --- General ---
loglevel notice
databases 16
