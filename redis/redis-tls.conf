# Redis TLS configuration for Elitea platform
# This config is used when REDIS_TLS_ENABLED=true
# Combines AOF (durability) + RDB (fast restarts) + TLS encryption

# --- Network ---
bind 0.0.0.0
port 6379
protected-mode no

# --- TLS ---
tls-port 6380
tls-cert-file /tls/redis.crt
tls-key-file /tls/redis.key
tls-ca-cert-file /tls/ca.crt
tls-auth-clients optional
tls-replication yes

# --- RDB Snapshots ---
save 900 1
save 300 10
save 60 10000

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# --- AOF (Append Only File) ---
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# --- General ---
loglevel notice
databases 16
