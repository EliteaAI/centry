# PostgreSQL Configuration Override for Horizontal Scaling
# Mounted into the postgres container to override defaults

# Connection limits
max_connections = 200

# Memory (proportional to max_connections)
shared_buffers = 256MB
work_mem = 4MB
maintenance_work_mem = 64MB
effective_cache_size = 768MB

# WAL settings for reliability
wal_buffers = 16MB
checkpoint_completion_target = 0.9

# Logging
log_min_duration_statement = 1000
log_connections = on
log_disconnections = on
