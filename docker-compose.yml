services:
  redis:
    image: redis:8.2.4-alpine
    command: sh -c 'exec redis-server --requirepass $$REDIS_PASSWORD --save 300 1 --dir /data/ --dbfilename dump.rdb'
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "10m"
    env_file:
      - ./envs/default.env
      - ./envs/override.env
    volumes:
      - redis-data:/data
    networks:
      - centry

  postgres:
    image: pgvector/pgvector:0.8.1-pg18
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "10m"
    env_file:
      - ./envs/default.env
      - ./envs/override.env
    environment:
      - PGDATA=/data/pgdata
    volumes:
      - postgres-data:/data
    networks:
      - centry

  pgbouncer:
    image: pgbouncer/pgbouncer:latest
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "10m"
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 6432"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - centry

  pylon_auth:
    image: ghcr.io/eliteaai/pylon:1.2.25
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "10m"
    env_file:
      - ./envs/default.env
      - ./envs/override.env
    environment:
      - NAME=pylon-auth
      - PYLON_WEB_RUNTIME=gevent
      - PYLON_CONFIG_SEED=file:/data/pylon.yml
    volumes:
      - ./pylon_auth:/data
      - ./ssl:/ssl
    depends_on:
      - redis
      - postgres
    networks:
      - centry

  pylon_main:
    image: ghcr.io/eliteaai/pylon:1.2.25
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "10m"
    env_file:
      - ./envs/default.env
      - ./envs/override.env
    environment:
      - NAME=pylon-main
      - PYLON_WEB_RUNTIME=gevent
      - PYLON_CONFIG_SEED=file:/data/pylon.yml
    volumes:
      - ./pylon_main:/data
      - ./ssl:/ssl
    ports:
      - "80:8080"
      # - 443:8443
    depends_on:
      - redis
      - postgres
    networks:
      - centry

  pylon_indexer:
    image: ghcr.io/eliteaai/pylon:1.2.25
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "10m"
    env_file:
      - ./envs/default.env
      - ./envs/override.env
    environment:
      - NAME=pylon-indexer
      - PYLON_WEB_RUNTIME=waitress
      - PYLON_CONFIG_SEED=file:/data/pylon.yml
    volumes:
      - ./pylon_indexer:/data
      - ./ssl:/ssl
    depends_on:
      - redis
    networks:
      - centry

  pylon_gateway:
    image: ghcr.io/eliteaai/pylon:1.2.25
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "10m"
    env_file:
      - ./envs/default.env
      - ./envs/override.env
    environment:
      - NAME=pylon-gateway
      - PYLON_WEB_RUNTIME=gevent
      - PYLON_CONFIG_SEED=file:/data/pylon.yml
    volumes:
      - ./pylon_gateway:/data
      - ./ssl:/ssl
    ports:
      - "8082:8080"
    depends_on:
      - redis
      - postgres
      - pylon_auth
    networks:
      - centry

volumes:
  redis-data:
  postgres-data:

networks:
  centry:
